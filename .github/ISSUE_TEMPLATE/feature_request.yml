name: Feature request
description: Something spechurl should do for OpenAPI to Hurl contract suites
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What contract-test workflow is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should generate or check behave? Include a sample spec and the Hurl you want if you have it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including doing this outside spechurl.
