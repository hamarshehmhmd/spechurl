openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0
  description: A small pet store used by the spechurl examples.
servers:
  - url: https://petstore.example.com
tags:
  - name: pets
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            minimum: 1
            example: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
          example: available
        - name: q
          in: query
          required: false
          description: Optional filter with no example; omitted from the suite.
          schema:
            type: string
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Bad request
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
            example:
              name: Fluffy
              tag: dog
              photoUrls:
                - https://example.com/fluffy.jpg
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid pet
  /pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: showPet
      summary: Info for a specific pet
      tags: [pets]
      responses:
        "200":
          description: Pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updatePet
      summary: Update a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [pets]
      responses:
        "204":
          description: Deleted
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: Pet identifier
      schema:
        type: integer
        format: int64
      example: 123
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 123
        name:
          type: string
          example: Fluffy
        tag:
          type: string
          example: dog
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string
          enum: [available, pending, sold]
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Fluffy
        tag:
          type: string
        photoUrls:
          type: array
          items:
            type: string
            format: uri
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
